<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missões 2026</title>
<style>
:root{
  --bg:#f6f7f9;--surface:#ffffff;--surface2:#eef0f4;--ink:#1c2230;--muted:#5d6678;--line:#dde1e8;
  --accent:#2f5d7c;--accent-ink:#ffffff;--warn:#b5651d;--bad:#b3261e;--ok:#2e6b4f;--chip:#e6ebf2;
  --radius:10px;--shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151b;--surface:#1a1f28;--surface2:#222937;--ink:#e6e9ef;--muted:#9aa3b5;--line:#2c3443;
    --accent:#7fb0d3;--accent-ink:#0f1720;--warn:#e0a060;--bad:#ef8a83;--ok:#7cc4a0;--chip:#263043;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#12151b;--surface:#1a1f28;--surface2:#222937;--ink:#e6e9ef;--muted:#9aa3b5;--line:#2c3443;
  --accent:#7fb0d3;--accent-ink:#0f1720;--warn:#e0a060;--bad:#ef8a83;--ok:#7cc4a0;--chip:#263043;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.2px;margin-right:auto}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
nav.tabs{max-width:1100px;margin:0 auto;padding:0 8px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;min-height:44px;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{min-height:32px;padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
h2{font-size:18px;margin:18px 0 10px}
h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted)}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 8px;font-size:12px;margin:1px 2px 1px 0}
.chip.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.chip.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.chip.ok{background:transparent;border:1px solid var(--ok);color:var(--ok)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:40px}
.toolbar input[type=search]{flex:1;min-width:160px}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{background:var(--surface2);font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--surface2)}
.tablewrap{overflow-x:auto}
@media (max-width:700px){
  table.resp thead{display:none}
  table.resp,table.resp tbody,table.resp tr,table.resp td{display:block;width:100%}
  table.resp tr{border-bottom:1px solid var(--line);padding:6px 0}
  table.resp td{border:0;padding:3px 12px}
  table.resp td[data-l]:before{content:attr(data-l) ": ";color:var(--muted);font-size:12px}
}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface2);border-radius:var(--radius);padding:8px;min-height:120px}
.col h3{display:flex;justify-content:space-between;padding:4px 4px 8px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:8px;cursor:pointer}
.task.overdue{border-left:4px solid var(--bad)}
.task.soon{border-left:4px solid var(--warn)}
.task .meta{font-size:12px;color:var(--muted);margin-top:4px}
.task .move{display:flex;gap:4px;margin-top:6px}
.quick{display:flex;gap:8px;margin-bottom:12px}
.quick input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);min-height:44px}
.timeline{border-left:2px solid var(--line);margin-left:8px;padding-left:16px}
.ev{position:relative;margin-bottom:14px}
.ev:before{content:"";position:absolute;left:-23px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.ev.past:before{background:var(--accent)}
.ev .d{font-weight:600}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;overflow-y:auto;padding:16px;transform:translateX(100%);transition:transform .2s}
.drawer.open{transform:none}
.drawer-bg.open{display:block}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px;color:var(--ink);font-size:15px;min-height:42px}
.form textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:500px){.row2{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:8px}
.notice{background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted);margin:10px 0}
.snack{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;display:none;gap:12px;align-items:center;z-index:60;max-width:calc(100% - 32px)}
.snack.show{display:flex}
.snack button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;cursor:pointer}
.lock{position:fixed;inset:0;background:var(--bg);z-index:80;display:none;align-items:center;justify-content:center;padding:16px}
.lock.show{display:flex}
.lock .card{width:min(380px,100%)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.ref h3{margin-bottom:6px}
.ref ul{margin:6px 0 6px 18px;padding:0}
.ref .src{font-size:12px;color:var(--muted)}
a{color:var(--accent)}
.countdown{font-size:22px;font-weight:700}
.list li{margin-bottom:4px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><span data-t="appName"></span><small data-t="appSub"></small></div>
    <button class="btn small" id="langBtn" aria-label="Language">EN</button>
    <button class="btn small" id="themeBtn" data-t="theme"></button>
    <button class="btn small" id="settingsBtn" data-t="settings"></button>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<main id="main"></main>

<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer" aria-modal="true" role="dialog"></aside>
<div class="snack" id="snack"><span id="snackMsg"></span><button id="snackUndo"></button></div>

<div class="lock" id="lock">
  <div class="card">
    <h3 data-t="locked"></h3>
    <p class="muted" data-t="lockedHelp"></p>
    <div class="form">
      <input type="password" id="lockPass" autocomplete="current-password">
      <button class="btn primary" id="unlockBtn" data-t="unlock"></button>
      <span class="muted" id="lockErr"></span>
    </div>
  </div>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

/* ================= storage & crypto ================= */
const KEY = "moe26-tracker";
let STATE = null, PASSKEY = null, PASSSALT = null, STORAGE_OK = true;
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,salt){
  const base = await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function encryptObj(obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM",iv},PASSKEY,enc.encode(JSON.stringify(obj)));
  return {enc:true,salt:b64(PASSSALT),iv:b64(iv),ct:b64(ct)};
}
async function decryptBlob(blob,pass){
  const salt = unb64(blob.salt); const key = await deriveKey(pass,salt);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(blob.iv)},key,unb64(blob.ct));
  PASSKEY = key; PASSSALT = salt;
  return JSON.parse(dec.decode(pt));
}

function rawSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ STORAGE_OK=false; return false; } }

function parseDateLoose(s){
  s=(s||"").trim(); if(!s) return "";
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m=s.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
  if(!m) return "";
  let y=m[3]?+m[3]:2026; if(y<100) y+=2000;
  const d=+m[1], mo=+m[2]; if(mo<1||mo>12||d<1||d>31) return "";
  return `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}

  const existing = id && missionById(id);
  const m = existing || M({status:"rev",rounds:["2"],final_status:"none",updated:todayISO()});
  openDrawer(missionForm(m));
  $("#mForm").onsubmit = e=>{
    e.preventDefault(); const f=new FormData(e.target);
    ["name_pt","name_en","acronym","type","status","head","size","states","agreement","prelim_date","prelim_url","final_status","prior","focus","notes"].forEach(k=>m[k]=(f.get(k)||"").trim());
    m.rounds=[f.get("r1")?"1":null,f.get("r2")?"2":null].filter(Boolean);
    m.sources=(f.get("sources")||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const [u,a]=l.split("|").map(x=>x.trim()); return {url:u,accessed:parseDateLoose(a)||todayISO()};});
    m.updated=todayISO();
    if(!existing) STATE.missions.push(m);
    save(); closeDrawer(); render(); snack(t("saved"));
  };
  const del=$("#delMission"); if(del) del.onclick=()=>{ removeWithUndo("missions",m); closeDrawer(); };
}

/* ---------- Backlog ---------- */
function taskClass(x){ const today=todayISO(); if(x.status==="done"||!x.due) return ""; if(x.due<today) return "overdue"; if(x.due<=RUNOFF_ISO) return "soon"; return ""; }
function taskCard(x){
  const m=x.mission&&missionById(x.mission);
  const keys=Object.keys(COLS), i=keys.indexOf(x.status);
  return `<div class="task ${taskClass(x)}" data-open-task="${x.id}">
    <div><span class="chip">${esc(x.priority)}</span> ${esc(x.title)}</div>
    <div class="meta">${x.due?fmtDate(x.due):""}${m?` · ${esc(m.acronym||missionName(m))}`:""}${x.owner?` · ${esc(x.owner)}`:""}</div>
    <div class="move">${i>0?`<button class="btn small" data-move="${x.id}" data-to="${keys[i-1]}" aria-label="←">←</button>`:""}${i<keys.length-1?`<button class="btn small" data-move="${x.id}" data-to="${keys[i+1]}" aria-label="→">→</button>`:""}</div>
  </div>`;
}
const prioSort=(a,b)=>(a.priority||"P9").localeCompare(b.priority||"P9")||(a.due||"9999").localeCompare(b.due||"9999");
function renderBacklog(){
  const tasks=[...STATE.tasks].sort(prioSort);
  const head=`<div class="quick"><input id="quickAdd" placeholder="${esc(t("quickPh"))}" aria-label="Quick add"><button class="btn primary" id="quickBtn">${t("add")}</button></div>
  <div class="toolbar"><button class="btn small ${VIEW.backlog==="board"?"primary":""}" data-view="board">${t("viewBoard")}</button><button class="btn small ${VIEW.backlog==="list"?"primary":""}" data-view="list">${t("viewList")}</button><button class="btn small" id="addTask">${t("addTask")}</button></div>`;
  if(!tasks.length) return head+`<div class="empty">${t("emptyTasks")}</div>`;
  if(VIEW.backlog==="board"){
    return head+`<div class="kanban">${Object.entries(COLS).map(([k,l])=>{const col=tasks.filter(x=>x.status===k); return `<div class="col"><h3><span>${t(l)}</span><span class="muted">${col.length}</span></h3>${col.map(taskCard).join("")}</div>`;}).join("")}</div>`;
  }
  return head+`<div class="tablewrap"><table class="resp"><thead><tr><th>${t("priority")}</th><th>${t("title")}</th><th>${t("due")}</th><th>${t("mission")}</th><th>${t("status")}</th><th>${t("owner")}</th></tr></thead><tbody>
  ${tasks.map(x=>{const m=x.mission&&missionById(x.mission); const c=taskClass(x); return `<tr class="row" data-open-task="${x.id}">
    <td data-l="${t("priority")}"><span class="chip">${esc(x.priority)}</span></td><td data-l="${t("title")}">${esc(x.title)}</td>
    <td data-l="${t("due")}" style="color:${c==="overdue"?"var(--bad)":c==="soon"?"var(--warn)":"inherit"}">${fmtDate(x.due)||"—"}</td>
    <td data-l="${t("mission")}">${m?esc(m.acronym||missionName(m)):"—"}</td><td data-l="${t("status")}">${esc(t(COLS[x.status]))}</td><td data-l="${t("owner")}">${esc(x.owner)||"—"}</td></tr>`;}).join("")}
  </tbody></table></div>`;
}
/* Quick add: "P1 Confirmar crachás OEA até 22/10" */
function matchMission(text){
  const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
  const words=norm(text);
  let best=null,bestLen=0;
  for(const m of STATE.missions){
    const cands=[...(m.acronym||"").split("/"),m.name_pt,m.name_en].map(s=>norm(s||"").trim()).filter(s=>s.length>=2);
    for(const c of cands){
      const re=new RegExp("(^|[^a-z0-9])"+c.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"($|[^a-z0-9])");
      if(re.test(words)&&c.length>bestLen){best=m;bestLen=c.length;}
    }
  }
  return best;
}
function parseQuick(text){
  let s=text.trim(), priority="P2", due="";
  const p=s.match(/(^|\s)(P[1-3])(?=\s|$)/i); if(p){priority=p[2].toUpperCase(); s=s.replace(p[0]," ");}
  const d=s.match(/\s(?:até|ate|by|due|em|on)?\s*(\d{1,2}\/\d{1,2}(?:\/\d{2,4})?)\s*$/i)||s.match(/(?:até|ate|by|due)\s+(\d{1,2}\/\d{1,2}(?:\/\d{2,4})?)/i);
  if(d){due=parseDateLoose(d[1]); s=s.replace(d[0]," ");}
  const title=s.replace(/\s+/g," ").trim();
  const m=matchMission(title);
  return {id:uid(),title,priority,due,mission:m?m.id:"",owner:"",status:"todo",notes:""};
}
function taskForm(x){
  const mopts=STATE.missions.map(m=>`<option value="${m.id}" ${x.mission===m.id?"selected":""}>${esc((m.acronym?m.acronym+" — ":"")+missionName(m))}</option>`).join("");
  return `<h2 style="margin-top:0">${esc(x.title||t("addTask"))}</h2>
  <form class="form" id="tForm">
    <label>${t("title")}<input name="title" value="${esc(x.title)}" required></label>
    <div class="row2"><label>${t("priority")}<select name="priority">${["P1","P2","P3"].map(p=>`<option ${x.priority===p?"selected":""}>${p}</option>`).join("")}</select></label>
      <label>${t("due")}<input type="date" name="due" value="${esc(x.due)}"></label></div>
    <div class="row2"><label>${t("status")}<select name="status">${Object.entries(COLS).map(([k,l])=>`<option value="${k}" ${x.status===k?"selected":""}>${esc(t(l))}</option>`).join("")}</select></label>
      <label>${t("owner")}<input name="owner" value="${esc(x.owner)}"></label></div>
    <label>${t("mission")}<select name="mission"><option value="">${t("none")}</option>${mopts}</select></label>
    <label>${t("notes")}<textarea name="notes">${esc(x.notes)}</textarea></label>
    <div class="actions"><span><button class="btn primary" type="submit">${t("save")}</button> <button class="btn" type="button" data-close>${t("cancel")}</button></span>
    ${STATE.tasks.includes(x)?`<button class="btn danger" type="button" id="delTask">${t("del")}</button>`:""}</div>
  </form>`;
}
function openTask(id){
  const existing=id&&STATE.tasks.find(x=>x.id===id);
  const x=existing||{id:uid(),title:"",priority:"P2",due:"",mission:"",owner:"",status:"todo",notes:""};
  openDrawer(taskForm(x));
  $("#tForm").onsubmit=e=>{e.preventDefault(); const f=new FormData(e.target);
    ["title","priority","due","status","owner","mission","notes"].forEach(k=>x[k]=(f.get(k)||"").trim());
    if(!existing) STATE.tasks.push(x); save(); closeDrawer(); render(); snack(t("saved"));};
  const del=$("#delTask"); if(del) del.onclick=()=>{removeWithUndo("tasks",x); closeDrawer();};
}

/* ---------- Timeline ---------- */
function renderTimeline(){
  const today=todayISO();
  const ev=[...STATE.timeline].sort((a,b)=>a.date.localeCompare(b.date));
  return `<div class="card" style="margin-bottom:12px"><form class="form" id="evForm"><div class="row2"><label>${t("date")}<input type="date" name="date" required></label><label>${t("event")}<input name="text" required></label></div><div><button class="btn primary" type="submit">${t("addEvent")}</button></div></form></div>
  <div class="timeline">${ev.map(e=>`<div class="ev ${e.date<today?"past":""}"><div class="d">${fmtDate(e.date)}${e.date===RUNOFF_ISO?' <span class="chip warn">2º turno</span>':""}</div><div>${esc(e.text)} <button class="btn small danger" data-del-ev="${e.id}" aria-label="${t("del")}">×</button></div></div>`).join("")}</div>`;
}
/* ---------- Sources ---------- */
function renderSources(){
  return `<div class="card" style="margin-bottom:12px"><form class="form" id="srcForm"><div class="row2"><label>${t("label")}<input name="label" required></label><label>${t("url")}<input type="url" name="url"></label></div><label>${t("tags")}<input name="tags"></label><div><button class="btn primary" type="submit">${t("addSource")}</button></div></form></div>
  <div class="grid">${STATE.sources.map(s=>`<div class="card" style="padding:10px 14px"><div style="display:flex;justify-content:space-between;gap:8px"><div>${safeUrl(s.url)?`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.label)}</a>`:esc(s.label)}<div>${(s.tags||"").split(",").map(x=>x.trim()).filter(Boolean).map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div></div><button class="btn small danger" data-del-src="${s.id}" aria-label="${t("del")}">×</button></div></div>`).join("")}</div>`;
}
/* ---------- Reference ---------- */
function renderRef(){
  return `<p class="muted">${esc(t("refIntro"))}</p><div class="grid g2 ref">${REF.map(c=>{const x=c[LANG]; return `<div class="card"><h3>${esc(x.h)}</h3><ul>${x.li.map(l=>`<li>${esc(l)}</li>`).join("")}</ul><div class="src">${LANG==="pt"?"Fonte: Guia Prático 2026":"Source: Practical Guide 2026"}, ${c.s}</div></div>`;}).join("")}</div>`;
}

/* ================= drawer, snack, undo ================= */
function openDrawer(html){ $("#drawer").innerHTML=html; $("#drawer").classList.add("open"); $("#drawerBg").classList.add("open"); const f=$("#drawer input"); if(f) setTimeout(()=>f.focus(),50); }
function closeDrawer(){ $("#drawer").classList.remove("open"); $("#drawerBg").classList.remove("open"); }
let snackTimer=null, undoFn=null;
function snack(msg,undo){
  $("#snackMsg").textContent=msg; undoFn=undo||null;
  $("#snackUndo").textContent=t("undo"); $("#snackUndo").style.display=undo?"inline":"none";
  $("#snack").classList.add("show"); clearTimeout(snackTimer); snackTimer=setTimeout(()=>{$("#snack").classList.remove("show"); undoFn=null;},8000);
}
function removeWithUndo(coll,item){
  const arr=STATE[coll], i=arr.indexOf(item); if(i<0) return;
  arr.splice(i,1);
  const unlinked = coll==="missions" ? STATE.tasks.filter(x=>x.mission===item.id) : [];
  unlinked.forEach(x=>x.mission="");
  save(); render();
  snack(t("deleted"),()=>{ arr.splice(Math.min(i,arr.length),0,item); unlinked.forEach(x=>x.mission=item.id); save(); render(); });
}

/* ================= settings ================= */
function openSettings(){
  openDrawer(`<h2 style="margin-top:0">${t("settings")}</h2>
  <div class="notice">${esc(t("privacy"))}</div>
  <div class="card" style="margin-bottom:12px"><h3>Backup</h3>
    <p class="muted" style="font-size:13px">${esc(t("shareHelp"))}</p>
    <div class="toolbar" style="margin:0">
      <button class="btn primary" id="copyBtn">${t("copyJ")}</button>
      <button class="btn primary" id="pasteBtn">${t("pasteJ")}</button>
      <button class="btn" id="expBtn">${t("exportJ")}</button>
      <button class="btn" id="impBtn">${t("importJ")}</button>
    </div>
  </div>
  <div class="card" style="margin-bottom:12px"><h3>${t("passTitle")}</h3><p class="muted" style="font-size:13px">${esc(t("passHelp"))}</p>
    <div class="toolbar" style="margin:0"><button class="btn" id="setPassBtn">${t("setPass")}</button>${PASSKEY?`<button class="btn" id="rmPassBtn">${t("removePass")}</button><button class="btn" id="lockBtn">${t("lockNow")}</button>`:""}</div></div>
  <div class="card"><button class="btn danger" id="resetBtn">${t("resetSeed")}</button></div>
  <div class="actions"><button class="btn" data-close>${t("cancel")}</button></div>`);
  $("#expBtn").onclick=exportJSON;
  $("#impBtn").onclick=()=>$("#importFile").click();
  $("#copyBtn").onclick=copyJSON;
  $("#pasteBtn").onclick=openPasteImport;
  $("#setPassBtn").onclick=async()=>{ const p=prompt(t("passPrompt")); if(p==null) return; if(p.length<8){alert(t("passShort"));return;}
    PASSSALT=crypto.getRandomValues(new Uint8Array(16)); PASSKEY=await deriveKey(p,PASSSALT); await saveNow(); closeDrawer(); snack(t("passSet")); };
  const rm=$("#rmPassBtn"); if(rm) rm.onclick=async()=>{ PASSKEY=null; PASSSALT=null; await saveNow(); closeDrawer(); snack(t("passRemoved")); };
  const lk=$("#lockBtn"); if(lk) lk.onclick=async()=>{ await saveNow(); PASSKEY=null; STATE=null; closeDrawer(); $("#main").innerHTML=""; showLock(); };
  $("#resetBtn").onclick=()=>{ if(confirm(t("resetConfirm"))){ STATE=seed(); save(); closeDrawer(); render(); } };
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(STATE,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`missoes-2026-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
}
function validState(o){ return o&&typeof o==="object"&&Array.isArray(o.missions)&&Array.isArray(o.tasks)&&Array.isArray(o.timeline)&&Array.isArray(o.sources); }
$("#importFile").onchange=async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{ const o=JSON.parse(await f.text()); if(!validState(o)) throw 0; STATE=o; save(); closeDrawer(); render(); snack(t("imported")); }
  catch(_){ alert(t("importErr")); }
};
async function copyJSON(){
  const text = JSON.stringify(STATE,null,2);
  try{ await navigator.clipboard.writeText(text); snack(t("copied")); }
  catch(_){
    openDrawer(`<h2 style="margin-top:0">${t("copyJ")}</h2><div class="form"><textarea rows="16" readonly onclick="this.select()">${esc(text)}</textarea><div class="actions"><button class="btn" type="button" data-close>${t("cancel")}</button></div></div>`);
    const ta=$("#drawer textarea"); if(ta) ta.select();
  }
}
function openPasteImport(){
  openDrawer(`<h2 style="margin-top:0">${t("pasteJTitle")}</h2>
  <form class="form" id="pasteForm">
    <textarea name="data" rows="16" placeholder="${esc(t("pasteJPh"))}" required></textarea>
    <div class="actions"><span><button class="btn primary" type="submit">${t("pasteJBtn")}</button> <button class="btn" type="button" data-close>${t("cancel")}</button></span></div>
  </form>`);
  $("#pasteForm").onsubmit=e=>{
    e.preventDefault();
    try{ const o=JSON.parse(new FormData(e.target).get("data")); if(!validState(o)) throw 0; STATE=o; save(); closeDrawer(); render(); snack(t("imported")); }
    catch(_){ alert(t("importErr")); }
  };
}

/* ================= lock ================= */
function showLock(){ applyStatic(); $("#lock").classList.add("show"); $("#lockErr").textContent=""; $("#lockPass").value=""; setTimeout(()=>$("#lockPass").focus(),50); }
async function tryUnlock(){
  try{ const blob=JSON.parse(rawGet(KEY)); STATE=await decryptBlob(blob,$("#lockPass").value); $("#lock").classList.remove("show"); render(); }
  catch(e){ $("#lockErr").textContent=t("wrongPass"); }
}
$("#unlockBtn").onclick=tryUnlock;
$("#lockPass").onkeydown=e=>{ if(e.key==="Enter") tryUnlock(); };

/* ================= events ================= */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-tab],[data-open-mission],[data-open-task],[data-move],[data-view],[data-close],[data-sort],[data-del-ev],[data-del-src]");
  if(!el) return;
  if(el.dataset.tab){ VIEW.tab=el.dataset.tab; render(); window.scrollTo(0,0); return; }
  if(el.dataset.move){ e.stopPropagation(); const x=STATE.tasks.find(t=>t.id===el.dataset.move); if(x){x.status=el.dataset.to; save(); render();} return; }
  if(el.dataset.openMission){ e.preventDefault(); openMission(el.dataset.openMission); return; }
  if(el.dataset.openTask){ e.preventDefault(); openTask(el.dataset.openTask); return; }
  if(el.dataset.view){ VIEW.backlog=el.dataset.view; savePrefs(); render(); return; }
  if(el.hasAttribute("data-close")){ closeDrawer(); return; }
  if(el.dataset.sort){ VIEW.dir = VIEW.sort===el.dataset.sort ? -VIEW.dir : 1; VIEW.sort=el.dataset.sort; render(); return; }
  if(el.dataset.delEv){ const x=STATE.timeline.find(v=>v.id===el.dataset.delEv); if(x) removeWithUndo("timeline",x); return; }
  if(el.dataset.delSrc){ const x=STATE.sources.find(v=>v.id===el.dataset.delSrc); if(x) removeWithUndo("sources",x); return; }
});
document.addEventListener("click",e=>{
  if(e.target.id==="addMission") openMission(null);
  if(e.target.id==="addTask") openTask(null);
  if(e.target.id==="quickBtn") quickAdd();
});
function quickAdd(){ const i=$("#quickAdd"); if(!i||!i.value.trim()) return; const x=parseQuick(i.value); if(!x.title) return; STATE.tasks.push(x); save(); render(); setTimeout(()=>$("#quickAdd")&&$("#quickAdd").focus(),0); snack(t("saved"),()=>{ STATE.tasks=STATE.tasks.filter(v=>v!==x); save(); render(); }); }
document.addEventListener("keydown",e=>{ if(e.target.id==="quickAdd"&&e.key==="Enter") quickAdd(); if(e.key==="Escape") closeDrawer(); });
document.addEventListener("input",e=>{
  if(e.target.id==="mq"){ VIEW.q=e.target.value; const pos=e.target.selectionStart; render(); const n=$("#mq"); n.focus(); n.setSelectionRange(pos,pos); }
});
document.addEventListener("change",e=>{
  if(e.target.id==="mtype"){ VIEW.ftype=e.target.value; render(); }
  if(e.target.id==="mstatus"){ VIEW.fstatus=e.target.value; render(); }
});
document.addEventListener("submit",e=>{
  if(e.target.id==="evForm"){ e.preventDefault(); const f=new FormData(e.target); STATE.timeline.push({id:uid(),date:f.get("date"),text:f.get("text").trim()}); save(); render(); }
  if(e.target.id==="srcForm"){ e.preventDefault(); const f=new FormData(e.target); STATE.sources.push({id:uid(),label:f.get("label").trim(),url:(f.get("url")||"").trim(),tags:(f.get("tags")||"").trim()}); save(); render(); }
});
$("#drawerBg").onclick=closeDrawer;
$("#snackUndo").onclick=()=>{ if(undoFn){ const f=undoFn; undoFn=null; f(); } $("#snack").classList.remove("show"); };
$("#langBtn").onclick=()=>{ LANG=LANG==="pt"?"en":"pt"; savePrefs(); STATE?render():applyStatic(); };
$("#themeBtn").onclick=()=>{ const r=document.documentElement; const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme=dark?"light":"dark"; savePrefs(); };
$("#settingsBtn").onclick=()=>{ if(STATE) openSettings(); };
setInterval(()=>{ const cd=$("#cd"); if(cd) cd.textContent=countdownText(); },30000);

/* ================= boot ================= */
(async function boot(){
  loadPrefs();
  const cloud = await cloudLoad();
  if(cloud){
    if(cloud.enc){ rawSet(KEY,JSON.stringify(cloud)); showLock(); return; }
    if(validState(cloud)){ STATE=cloud; rawSet(KEY,JSON.stringify(cloud)); render(); return; }
  }
  const raw=rawGet(KEY);
  if(raw){
    try{ const o=JSON.parse(raw); if(o&&o.enc){ showLock(); return; } if(validState(o)){ STATE=o; save(); render(); return; } }catch(e){}
  }
  STATE=seed(); save(); render();
})();
</script>
